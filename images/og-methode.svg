<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">Parcours &amp; méthode — AVEC VINCENT</title><desc id="desc">Stanislas, trois années de prépa ECG, puis emlyon. Découvre mon parcours et la préparation des séances à partir de tes cours, copies et échanges.</desc><defs><linearGradient id="blue" x2="1" y2="1"><stop stop-color="#102d42"/><stop offset="1" stop-color="#397685"/></linearGradient></defs><rect width="1200" height="630" fill="url(#blue)"/><text x="72" y="92" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="3" fill="#faf9f6">AVEC VINCENT<tspan fill="#9fd8df">.</tspan></text><text x="72" y="268" font-family="Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-2" fill="#fff">Mon parcours.</text><text x="72" y="353" font-family="Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-2" fill="#b4e0e5">Ma façon de travailler.</text><text x="75" y="418" font-family="Arial, sans-serif" font-size="27" fill="#e0ebf0">Une séance préparée à partir de tes travaux.</text><path d="M790 558C865 558 850 526 915 526S1000 552 1040 502 1125 512 1200 466" stroke="#9fd8df" stroke-opacity=".10" stroke-width="20" fill="none"/><path d="M790 558C865 558 850 526 915 526S1000 552 1040 502 1125 512 1200 466" stroke="#9fd8df" stroke-opacity=".55" stroke-width="2" fill="none"/><circle cx="1040" cy="502" r="4" fill="#9fd8df"/><text x="75" y="516" font-family="Arial, sans-serif" font-size="25" fill="#e0ebf0">À domicile à Lyon · En visio</text><text x="75" y="560" font-family="Arial, sans-serif" font-size="23" fill="#c5dce5">avecvincent.fr</text></svg>